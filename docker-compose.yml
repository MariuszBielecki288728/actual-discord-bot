services:
  bot:
    build: .
    restart: unless-stopped
    depends_on:
      actual_server:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_HOT_RELOAD=true
      - DISCORD_SHOW_ERROR_TRACEBACKS=${DISCORD_SHOW_ERROR_TRACEBACKS:-true}
      - ACTUAL_URL=http://actual_server:5006
      - ACTUAL_PASSWORD=${ACTUAL_PASSWORD}
      - ACTUAL_FILE=${ACTUAL_FILE}
      - ACTUAL_ACCOUNT=${ACTUAL_ACCOUNT:-Pekao}
      - ACTUAL_ENCRYPTION_PASSWORD=${ACTUAL_ENCRYPTION_PASSWORD:-}
      - DISCORD_BANK_NOTIFICATION_CHANNEL=${DISCORD_BANK_NOTIFICATION_CHANNEL}
      - DISCORD_BANK_IMPORT_CHANNEL=${DISCORD_BANK_IMPORT_CHANNEL:-}
      - DISCORD_RECEIPT_CHANNEL=${DISCORD_RECEIPT_CHANNEL:-}
      - BANK_NOTIFICATION_TIMEZONE=${BANK_NOTIFICATION_TIMEZONE:-Europe/Warsaw}
      - BANK_IMPORT_TIMEZONE=${BANK_IMPORT_TIMEZONE:-Europe/Warsaw}
      - OCR_PROVIDER=${OCR_PROVIDER:-tesseract}

    command: python -u -m actual_discord_bot.bot

  actual_server:
    image: docker.io/actualbudget/actual-server:26.8.0
    ports:
      - '12012:5006'
    volumes:
      - ./actual-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5006').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  test_actual_server:
    image: docker.io/actualbudget/actual-server:26.8.0
    ports:
      - '12013:5006'
    profiles:
      - testing

  integration_tests:
    build:
      context: .
      target: testing
    depends_on:
      - test_actual_server
    environment:
      - ACTUAL_TEST_URL=http://test_actual_server:5006
    command: pytest tests/integration_tests/ -v
    profiles:
      - testing
